[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lowpcode-data-origin-engine"
version = "0.1.0"
description = "Low-Pcode physical-state backward-slice engine snapshot"
requires-python = ">=3.11"
dependencies = [
  "rustworkx>=0.18,<0.19",
  "z3-solver>=4.16,<4.17",
]

[tool.setuptools.packages.find]
where = ["src"]
